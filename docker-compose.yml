services:
  magma:
    build: .
    image: ghcr.io/s0mberlain/magmagui:latest
    container_name: magma
    restart: unless-stopped
    ports:
      - "${MAGMA_PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
    volumes:
      - magma-data:/data

  # Local SSO testing only: `docker compose --profile keycloak up -d`
  # Users alice / bob / carol (admin / analyst / auditor), password "<name>-password";
  # dave has no group and is refused. Settings for the app: see .env.example.
  keycloak:
    profiles: ["keycloak"]
    image: quay.io/keycloak/keycloak:26.0.7
    command: ["start-dev", "--import-realm"]
    environment:
      # development credentials: never expose this profile beyond your own machine
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # The browser uses localhost:8081, the app container talks to keycloak:8080.
      KC_HOSTNAME: http://localhost:8081
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "8081:8080"
    volumes:
      - ./deploy/keycloak:/opt/keycloak/data/import:ro

  # Local git sync testing only: `docker compose --profile gitea up -d`
  # Gitea on http://localhost:3000, user magma / magma-password, repository magma/usecases.
  # Settings for the app: see .env.example (GIT_*).
  gitea:
    profiles: ["gitea"]
    image: docker.io/gitea/gitea:1.22.6
    environment:
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__ROOT_URL: http://localhost:3000/
      GITEA__database__DB_TYPE: sqlite3
      GITEA__service__DISABLE_REGISTRATION: "true"
    ports:
      - "3000:3000"
    volumes:
      - gitea-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:3000/api/healthz"]
      interval: 5s
      retries: 20
  gitea-init:
    profiles: ["gitea"]
    image: docker.io/gitea/gitea:1.22.6
    depends_on:
      gitea:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/init.sh"]
    restart: "no"
    volumes:
      - gitea-data:/data
      - ./deploy/gitea/init.sh:/init.sh:ro

volumes:
  magma-data:
  gitea-data:
